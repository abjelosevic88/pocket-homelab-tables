name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - name: Build web UI
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: Vet & test
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          go test ./...
          CGO_ENABLED=0 GOARCH=arm GOARM=7 go build ./...   # 32-bit: the armv7 release
      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o pocket-tables ./cmd/pocket-tables
      - name: Smoke test
        run: |
          DATA_DIR=/tmp/ptb DEMO_DATA=true AUTH_MODE=none ./pocket-tables &
          sleep 3
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/api/v1/summary | grep -q '"tables"'
          curl -fsS http://localhost:8080/api/v1/bases | grep -q 'Projects'
          curl -fsS 'http://localhost:8080/api/v1/tables/2/records?named=1' | grep -q 'Write the texts'
          curl -fsS 'http://localhost:8080/api/v1/search?q=van' | grep -q 'van'
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pocket-tables:pr
